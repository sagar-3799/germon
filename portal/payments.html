<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billing &amp; Payments | Germon IT Solution</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/portal.css">
</head>
<body>

  <!-- Navigation Bar Placeholder -->
  <div id="portalNavPlaceholder"></div>

  <div class="container-fluid px-3 px-lg-4 py-4">
    
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
      <div>
        <h2 class="fw-bold mb-1 text-dark"><i class="bi bi-cash-stack text-success me-2"></i>Job Costing &amp; Payment Ledger</h2>
        <p class="text-muted small mb-0">Record advances, monitor due receivables, and track Fonepay, eSewa, and Cash collections.</p>
      </div>
    </div>

    <!-- Financial Stats Row -->
    <div class="row g-3 mb-4" id="paymentStatsRow">
      <!-- Populated via JS -->
    </div>

    <!-- Payments Table Card -->
    <div class="data-table-card">
      <div class="data-table-header d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2">
        <div class="d-flex align-items-center gap-2">
          <button type="button" class="btn btn-sm btn-primary fw-bold" id="payTabPending" onclick="switchPayTab('pending')">
            ⚡ Pending Receivables (Active Dues)
          </button>
          <button type="button" class="btn btn-sm btn-outline-success fw-semibold" id="payTabCleared" onclick="switchPayTab('cleared')">
            ✅ Paid &amp; Cleared History
          </button>
          <button type="button" class="btn btn-sm btn-outline-secondary fw-semibold" id="payTabAll" onclick="switchPayTab('all')">
            🌐 All Records
          </button>
        </div>
        <div class="d-flex align-items-center gap-2">
          <div class="input-group input-group-sm" style="width: 220px;">
            <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
            <input type="text" id="paymentSearch" class="form-control" placeholder="Search client or Job ID..." onkeyup="renderPayments()">
          </div>
          <button type="button" class="btn btn-sm btn-danger fw-bold d-none" id="btnClearAllCleared" onclick="clearAllPaidHistory()">
            <i class="bi bi-trash3-fill me-1"></i> Clear All History
          </button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="custom-table table">
          <thead>
            <tr>
              <th>Job ID</th>
              <th>Client &amp; Service</th>
              <th>Estimated Cost</th>
              <th>Advance</th>
              <th>Paid Amount</th>
              <th>Remaining Due</th>
              <th>Payment Mode</th>
              <th>Status</th>
              <th class="text-end pe-3">Action</th>
            </tr>
          </thead>
          <tbody id="paymentsTableBody">
            <!-- Populated via JS -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- COLLECT PAYMENT MODAL -->
  <div class="modal fade" id="collectPayModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
        <div class="modal-header bg-success text-white border-0 py-3">
          <h5 class="modal-title fw-bold"><i class="bi bi-cash me-2"></i>Collect / Update Payment</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form id="collectPayForm">
          <div class="modal-body p-4">
            <input type="hidden" id="payJobId">
            <div class="mb-3">
              <label class="form-label fw-bold small text-muted text-uppercase">Client &amp; Job:</label>
              <div class="fw-bold fs-6 text-dark" id="payClientSummary">Hotel Bharatpur (JOB-2026-0001)</div>
            </div>
            
            <div class="row g-3">
              <div class="col-6">
                <label class="form-label fw-semibold small">Fixed Total Bill (Rs.)</label>
                <input type="number" class="form-control fw-bold font-monospace" id="payTotalAmount" required oninput="calculatePayModalDue()">
              </div>
              <div class="col-6">
                <label class="form-label fw-semibold small">Previously Paid (Rs.)</label>
                <input type="number" class="form-control fw-bold font-monospace bg-light" id="payPrevPaidAmount" readonly value="0">
              </div>
              <div class="col-6">
                <label class="form-label fw-semibold small text-success">New Payment Received Now (Rs.)</label>
                <input type="number" class="form-control fw-bold font-monospace border-success text-success" id="payNewAmount" placeholder="e.g. 1000" min="0" oninput="calculatePayModalDue()">
              </div>
              <div class="col-6">
                <label class="form-label fw-semibold small text-danger">New Remaining Due</label>
                <input type="text" class="form-control fw-bold font-monospace bg-light text-danger" id="payDueDisplay" readonly value="Rs. 0">
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold small">Payment Mode</label>
                <select class="form-select" id="payModeSelect">
                  <option value="Fonepay">Fonepay QR</option>
                  <option value="Cash">Cash</option>
                  <option value="eSewa">eSewa</option>
                  <option value="Khalti">Khalti</option>
                  <option value="Bank Transfer">Bank Transfer</option>
                  <option value="Cheque">Cheque</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold small">Payment Note / Cheque or Txn ID</label>
                <input type="text" class="form-control" id="payTxnNote" placeholder="e.g. Fonepay Txn ID #998822 or Cheque #102938">
              </div>
            </div>
          </div>
          <div class="modal-footer bg-light border-0">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-success px-4 fw-bold">Update Payment</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/nav.js"></script>
  <script>
    let currentPayTab = 'pending'; // 'pending', 'cleared', 'all'

    document.addEventListener('DOMContentLoaded', function () {
      renderPayments();
    });

    function switchPayTab(tab) {
      currentPayTab = tab;
      document.getElementById('payTabPending').className = tab === 'pending' ? 'btn btn-sm btn-primary fw-bold' : 'btn btn-sm btn-outline-primary fw-semibold';
      document.getElementById('payTabCleared').className = tab === 'cleared' ? 'btn btn-sm btn-success fw-bold' : 'btn btn-sm btn-outline-success fw-semibold';
      document.getElementById('payTabAll').className = tab === 'all' ? 'btn btn-sm btn-secondary fw-bold' : 'btn btn-sm btn-outline-secondary fw-semibold';
      
      const btnClearAll = document.getElementById('btnClearAllCleared');
      if (btnClearAll) {
        if (tab === 'cleared' && GermonStore.getCurrentUser()?.role === 'admin') {
          btnClearAll.classList.remove('d-none');
        } else {
          btnClearAll.classList.add('d-none');
        }
      }

      renderPayments();
    }

    function renderPayments() {
      const q = (document.getElementById('paymentSearch').value || '').toLowerCase();
      const allJobs = GermonStore.getJobs();

      // Calculate Global Financial Stats across all jobs
      let totalEst = 0;
      let totalPaid = 0;
      let totalDue = 0;

      allJobs.forEach(j => {
        const est = Number(j.finalAmount || j.estimatedAmount || 0);
        const paid = Number(j.paidAmount || 0);
        totalEst += est;
        totalPaid += paid;
        if (est > paid) totalDue += (est - paid);
      });

      document.getElementById('paymentStatsRow').innerHTML = `
        <div class="col-md-4">
          <div class="stat-card accent-primary">
            <div class="stat-card-accent"></div>
            <div class="stat-label">Total Job Invoiced</div>
            <div class="stat-value text-primary">Rs. ${totalEst.toLocaleString('en-IN')}</div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card accent-success">
            <div class="stat-card-accent"></div>
            <div class="stat-label">Total Cash &amp; Digital Collected</div>
            <div class="stat-value text-success">Rs. ${totalPaid.toLocaleString('en-IN')}</div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card accent-danger">
            <div class="stat-card-accent"></div>
            <div class="stat-label">Total Outstanding Due</div>
            <div class="stat-value text-danger">Rs. ${totalDue.toLocaleString('en-IN')}</div>
          </div>
        </div>
      `;

      // Filter display jobs based on current tab filter & search
      let jobs = allJobs;
      if (currentPayTab === 'pending') {
        // Pending Receivables: ONLY jobs with active due > 0 or unquoted jobs (must NOT be paid)
        jobs = jobs.filter(j => {
          const est = Number(j.finalAmount || j.estimatedAmount || 0);
          const paid = Number(j.paidAmount || 0);
          const due = est - paid;
          const isPaid = (est > 0 && paid >= est) || j.paymentStatus === 'paid';
          return !isPaid && (due > 0 || (est === 0 && paid === 0));
        });
      } else if (currentPayTab === 'cleared') {
        // Paid & Cleared History: Completed payments where due <= 0 and total > 0
        jobs = jobs.filter(j => {
          const est = Number(j.finalAmount || j.estimatedAmount || 0);
          const paid = Number(j.paidAmount || 0);
          return est > 0 && paid >= est;
        });
      }

      if (q) {
        jobs = jobs.filter(j => 
          j.id.toLowerCase().includes(q) || 
          j.clientName.toLowerCase().includes(q) || 
          j.workType.toLowerCase().includes(q)
        );
      }

      const tbody = document.getElementById('paymentsTableBody');
      tbody.innerHTML = '';

      if (jobs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" class="text-center py-4 text-muted">No ${currentPayTab === 'pending' ? 'pending dues' : (currentPayTab === 'cleared' ? 'cleared payment history' : 'records')} found.</td></tr>`;
        return;
      }

      jobs.forEach(j => {
        const est = Number(j.finalAmount || j.estimatedAmount || 0);
        const adv = Number(j.advanceAmount || 0);
        const paid = Number(j.paidAmount || 0);
        const due = Math.max(0, est - paid);

        let statusBadge = '<span class="badge bg-success">Paid</span>';
        if (due > 0 && paid > 0) statusBadge = '<span class="badge bg-warning text-dark">Partial</span>';
        if (paid === 0) statusBadge = '<span class="badge bg-danger">Pending</span>';

        tbody.innerHTML += `
          <tr>
            <td><strong class="text-primary font-monospace">${j.id}</strong></td>
            <td>
              <div class="fw-bold text-dark">${escapeHtml(j.clientName)}</div>
              <div class="small text-muted">${escapeHtml(j.workType)}</div>
            </td>
            <td><strong>Rs. ${est.toLocaleString('en-IN')}</strong></td>
            <td class="text-muted">Rs. ${adv.toLocaleString('en-IN')}</td>
            <td class="text-success fw-bold">Rs. ${paid.toLocaleString('en-IN')}</td>
            <td class="${due > 0 ? 'text-danger fw-bold' : 'text-muted'}">Rs. ${due.toLocaleString('en-IN')}</td>
            <td><span class="badge bg-light text-dark border">${j.paymentMode || 'Cash'}</span></td>
            <td>${statusBadge}</td>
            <td class="text-end pe-3">
              <div class="d-flex justify-content-end gap-1">
                <button class="btn btn-sm btn-outline-success" onclick="openCollectModal('${j.id}')" title="Collect / Update Payment">
                  <i class="bi bi-wallet2 me-1"></i> Collect
                </button>
                ${(GermonStore.getCurrentUser()?.role === 'admin' && currentPayTab !== 'pending') ? `
                  <button class="btn btn-sm btn-outline-danger" onclick="deletePaymentRecord('${j.id}', '${escapeHtml(j.clientName)}')" title="Delete Record">
                    <i class="bi bi-trash3-fill"></i>
                  </button>
                ` : ''}
              </div>
            </td>
          </tr>
        `;
      });
    }

    function openCollectModal(jobId) {
      const job = GermonStore.getJobById(jobId);
      if (!job) return;

      document.getElementById('payJobId').value = job.id;
      document.getElementById('payClientSummary').textContent = `${job.clientName} (${job.id})`;
      document.getElementById('payTotalAmount').value = Number(job.finalAmount || job.estimatedAmount || 0);
      document.getElementById('payPrevPaidAmount').value = Number(job.paidAmount || 0);
      document.getElementById('payNewAmount').value = '';
      document.getElementById('payModeSelect').value = job.paymentMode || 'Fonepay';
      document.getElementById('payTxnNote').value = '';

      calculatePayModalDue();

      const modal = new bootstrap.Modal(document.getElementById('collectPayModal'));
      modal.show();
    }

    function calculatePayModalDue() {
      const total = Number(document.getElementById('payTotalAmount').value) || 0;
      const prev = Number(document.getElementById('payPrevPaidAmount').value) || 0;
      const newAmt = Number(document.getElementById('payNewAmount').value) || 0;
      const accum = prev + newAmt;
      const due = Math.max(0, total - accum);
      document.getElementById('payDueDisplay').value = `Rs. ${due.toLocaleString('en-IN')}`;
    }

    document.getElementById('collectPayForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const jobId = document.getElementById('payJobId').value;
      const total = Number(document.getElementById('payTotalAmount').value) || 0;
      const prev = Number(document.getElementById('payPrevPaidAmount').value) || 0;
      const newAmt = Number(document.getElementById('payNewAmount').value) || 0;
      const finalPaid = prev + newAmt;
      const mode = document.getElementById('payModeSelect').value;
      const note = document.getElementById('payTxnNote').value.trim();

      const job = GermonStore.getJobById(jobId);
      if (job) {
        GermonStore.updateJobStatus(jobId, job.status, {
          finalAmount: total,
          estimatedAmount: total,
          paidAmount: finalPaid,
          paymentMode: mode,
          note: newAmt > 0 ? `Payment collected: +Rs. ${newAmt} via ${mode}${note ? ' (' + note + ')' : ''} (Accumulated Paid: Rs. ${finalPaid} / Rs. ${total})` : `Payment details updated`
        });

        GermonStore.logAudit('PAYMENT_UPDATE', `Updated payment for ${jobId}: Total Rs. ${total}, Paid Rs. ${finalPaid}`);
      }

      bootstrap.Modal.getInstance(document.getElementById('collectPayModal')).hide();
      alert(`Payment for ${jobId} updated successfully! (Total Paid: Rs. ${finalPaid})`);
      renderPayments();
    });

    function deletePaymentRecord(jobId, clientName) {
      const currentUser = GermonStore.getCurrentUser();
      if (!currentUser || currentUser.role !== 'admin') {
        alert('Access denied! Only Admin can delete payment history records.');
        return;
      }

      if (confirm(`Are you sure you want to delete payment record for ${jobId} (${clientName})?\n\nThis will permanently remove this record from the payment ledger.`)) {
        try {
          GermonStore.deleteJob(jobId);
          alert(`Payment record for ${jobId} deleted successfully.`);
          renderPayments();
        } catch (err) {
          alert(err.message);
        }
      }
    }

    function clearAllPaidHistory() {
      const currentUser = GermonStore.getCurrentUser();
      if (!currentUser || currentUser.role !== 'admin') {
        alert('Access denied! Only Admin can clear payment history.');
        return;
      }

      const allJobs = GermonStore.getJobs();
      const clearedJobs = allJobs.filter(j => {
        const est = Number(j.finalAmount || j.estimatedAmount || 0);
        const paid = Number(j.paidAmount || 0);
        return est > 0 && paid >= est;
      });

      if (clearedJobs.length === 0) {
        alert('No paid & cleared history records to delete.');
        return;
      }

      if (confirm(`Are you sure you want to PERMANENTLY DELETE all ${clearedJobs.length} cleared payment history records?\n\nThis action cannot be undone.`)) {
        clearedJobs.forEach(j => {
          GermonStore.deleteJob(j.id);
        });
        alert(`${clearedJobs.length} paid history records deleted successfully!`);
        renderPayments();
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
