<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Portal Login | Germon IT Solution Pvt. Ltd.</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/portal.css">
  <style>
    .login-container {
      min-height: 100vh;
      background: radial-gradient(circle at top right, rgba(43, 46, 131, 0.15), transparent 40%),
                  radial-gradient(circle at bottom left, rgba(24, 168, 232, 0.12), transparent 40%),
                  #0B0F19;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: #FFFFFF;
      border-radius: 20px;
      overflow: hidden;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .login-header {
      background: linear-gradient(135deg, #1E215C 0%, #2B2E83 100%);
      padding: 30px 25px;
      text-align: center;
      color: #FFF;
      position: relative;
    }
    .quick-login-btn {
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
    }
  </style>
</head>
<body class="login-container">

  <div class="login-card">
    <div class="login-header">
      <h3 class="fw-bold mb-0">GERMON IT SOLUTION</h3>
      <p class="text-info small mb-0 fw-semibold text-uppercase letter-spacing-1">Office Work &amp; Technician Portal</p>
      <div class="mt-2">
        <span class="badge bg-white bg-opacity-25 text-white small px-2 py-1">
          <i class="bi bi-geo-alt-fill text-warning me-1"></i>Narayangarh, Chitwan
        </span>
      </div>
    </div>

    <div class="p-4 p-sm-5">
      <div id="loginAlert" class="alert d-none py-2 px-3 small rounded-3" role="alert"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label fw-semibold text-muted small">Email Address / Phone Number</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person-fill"></i></span>
            <input type="text" id="loginEmail" class="form-control border-start-0" placeholder="Enter email or phone number" required autocomplete="username">
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold text-muted small">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-key-fill"></i></span>
            <input type="password" id="loginPass" class="form-control border-start-0" placeholder="Enter password" required autocomplete="current-password">
            <button class="btn btn-outline-secondary border-start-0" type="button" id="togglePasswordBtn">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm" style="background: #2B2E83; border-color: #2B2E83;">
          <i class="bi bi-box-arrow-in-right me-2"></i> Sign In to Portal
        </button>
      </form>

      <div class="mt-3 text-center">
        <a href="../index.html" class="text-decoration-none small text-muted">
          <i class="bi bi-arrow-left me-1"></i> Return to Public Website
        </a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/store.js"></script>
  <script>
    // Auto Login OFF: Require password entry on every login page visit
    // Auto Save Username ON: Pre-fill last used Email/Phone
    document.addEventListener('DOMContentLoaded', function () {
      const savedUser = localStorage.getItem('germon_saved_username') || GermonStore.getCurrentUser()?.email || GermonStore.getCurrentUser()?.phone || '';
      if (savedUser) {
        const emailInput = document.getElementById('loginEmail');
        emailInput.value = savedUser;
        document.getElementById('loginPass').focus();
      }
    });

    // Toggle Password Visibility
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const passInput = document.getElementById('loginPass');
    toggleBtn.addEventListener('click', () => {
      const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passInput.setAttribute('type', type);
      toggleBtn.innerHTML = type === 'password' ? '<i class="bi bi-eye"></i>' : '<i class="bi bi-eye-slash"></i>';
    });

    // Handle Form Submit
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPass').value;
      doLogin(email, pass);
    });

    function doLogin(email, pass) {
      const res = GermonStore.login(email, pass);
      const alertBox = document.getElementById('loginAlert');
      if (res.success) {
        // Auto Save Username ON: Store email/phone for future login pre-fill
        localStorage.setItem('germon_saved_username', email);

        alertBox.classList.add('d-none');
        if (res.user.role === 'technician') {
          window.location.href = 'technician.html';
        } else {
          window.location.href = 'dashboard.html';
        }
      } else {
        alertBox.className = 'alert alert-danger py-2 px-3 small rounded-3';
        alertBox.innerHTML = `<i class="bi bi-exclamation-triangle-fill me-1"></i> ${res.message}`;
        alertBox.classList.remove('d-none');
      }
    }
  </script>
</body>
</html>
